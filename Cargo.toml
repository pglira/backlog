[package]
name = "backlog"
version = "0.12.0"
edition = "2024"
description = "A TUI to manage the issues in a .backlog.md file"
license = "MIT"

[dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
ratatui-image = { version = "11", default-features = false, features = ["crossterm"] }
