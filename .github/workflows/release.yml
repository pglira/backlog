name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.arch }}-unknown-linux-musl
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo test --locked
      - name: Build a static binary
        run: cargo build --release --locked --target ${{ matrix.arch }}-unknown-linux-musl
      - name: Check that the version matches the tag
        run: test "$(./target/${{ matrix.arch }}-unknown-linux-musl/release/backlog --version)" = "backlog ${GITHUB_REF_NAME#v}"
      - run: cp target/${{ matrix.arch }}-unknown-linux-musl/release/backlog backlog-${{ matrix.arch }}-unknown-linux-musl
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.arch }}
          path: backlog-${{ matrix.arch }}-unknown-linux-musl

  release:
    name: GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
